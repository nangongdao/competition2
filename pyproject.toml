[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 + F：只拦截真正的问题（未定义名、未用导入、语法/缩进错误）。
# 不启用 I001 等风格规则，避免把存量风格的改造压力压到 CI 门禁上。
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 平铺测试文件为兼容旧版 Python 运行时，先在模块顶部注入 sys.path 再导入，
# 由此产生的 E402 属于该模式的预期行为。
"test_*.py" = ["E402"]
"**/test_*.py" = ["E402"]
"tools/endurance_preflight.py" = ["E402"]
