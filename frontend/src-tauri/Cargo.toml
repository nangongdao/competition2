[package]
name = "ai-interpreter"
version = "0.1.0"
description = "AI 同声传译助手桌面端（Tauri v2）"
authors = ["AI Interpreter Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_interpreter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"

[features]
# 系统音频采集（loopback）实验特性，默认关闭。
# 开启后需要系统安装 loopback 设备驱动（Windows WASAPI / macOS BlackHole 等）。
system-audio = ["dep:cpal"]

[dependencies.cpal]
version = "0.15"
optional = true
