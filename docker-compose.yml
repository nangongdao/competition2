# AI 同声传译助手一键启动编排
#
# 启动：docker compose up --build
# 前端在 http://localhost:5173 由宿主机独立运行（npm run dev），
# 后端与 Redis 由本编排提供。
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # 容器内必须监听所有接口，供端口映射使用（对外暴露范围由编排控制）。
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
    env_file:
      - path: backend/.env.local
        required: false
    depends_on:
      redis:
        condition: service_healthy
